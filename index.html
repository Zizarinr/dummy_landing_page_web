<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Teknik Informatika — Universitas Dummy (Landing Page Dummy)</title>
    <meta
      name="description"
      content="Landing page dummy/desain sementara untuk Program Studi Teknik Informatika. Seluruh konten bersifat placeholder dan belum merupakan data resmi."
    />
    <!-- Set tema sebelum paint untuk menghindari kedipan (FOUC) -->
    <script>
      (function () {
        var theme;
        try {
          theme = localStorage.getItem('theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/styles/variables.css" />
    <link rel="stylesheet" href="/src/styles/global.css" />
  </head>
  <body>
    <a class="skip-link" href="#konten-utama">Lewati ke konten utama</a>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
